version: 2

project_name: treehouse

builds:
  - id: treehouse
    main: ./cmd/treehouse
    binary: treehouse
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: treehouse
    ids: [treehouse]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

# Pushing the formula needs write access to homebrew-tap, which the
# workflow's default GITHUB_TOKEN does not have — hence the dedicated
# HOMEBREW_TAP_GITHUB_TOKEN secret (fine-grained PAT, contents:write on
# homebrew-tap only). See .github/workflows/release.yml.
brews:
  - name: treehouse
    ids: [treehouse]
    repository:
      owner: geocodio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/geocodio/treehouse"
    description: "Isolated docker-compose stacks per git worktree"
    license: "MIT"
